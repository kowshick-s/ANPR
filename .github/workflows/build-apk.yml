name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (plate parser + multi-camera fusion)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Build release APK
        run: ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk VehicleGateANPR-build-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VehicleGateANPR-build-${{ github.run_number }}
          path: VehicleGateANPR-build-${{ github.run_number }}.apk

      - name: Publish as GitHub Release (easy download on phone / TV box)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: VehicleGateANPR-build-${{ github.run_number }}.apk
          make_latest: true
