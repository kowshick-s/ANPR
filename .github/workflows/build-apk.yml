name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (plate parser + multi-camera fusion)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Check signing key password is configured
        env:
          ANPR_KEYSTORE_PASSWORD: ${{ secrets.ANPR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANPR_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret ANPR_KEYSTORE_PASSWORD is missing. Add it under Settings > Secrets and variables > Actions. Without it the APK would not install over the existing app."
            exit 1
          fi

      - name: Build release APK (signed with the fixed release key)
        env:
          ANPR_KEYSTORE_PASSWORD: ${{ secrets.ANPR_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Verify APK signature is the fixed release key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "CN=Vehicle Gate ANPR" certs.txt

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk VehicleGateANPR-build-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VehicleGateANPR-build-${{ github.run_number }}
          path: VehicleGateANPR-build-${{ github.run_number }}.apk

      - name: Publish as GitHub Release (easy download on phone / TV box)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: VehicleGateANPR-build-${{ github.run_number }}.apk
          make_latest: true
